[package]
name = "ess-standalone"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "horizon-essentials' pure modules compiled outside Horizon, for fast tests (L1)"
publish = false

# Only crates horizon-client itself depends on, so the same sources compile when injected.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
