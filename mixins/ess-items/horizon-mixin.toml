[mod]
id = "horizon-essentials-items"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "9669600c389ad6d205db4ec0bb061935f2a38d0c"

# Pure logic (also compiled by crates/ess-standalone for fast tests).
[[module]]
id = "items"
file = "crates/horizon-client/src/game.rs"
name = "ess_items"
source = "ess_items.rs"

# The item alias database, enchantment and potion names (GENERATED by tools/items_db.py from EssentialsX).
[[module]]
id = "items-db"
file = "crates/horizon-client/src/game.rs"
name = "ess_items_db"
source = "ess_items_db.rs"

# Game-only glue: this area's Host methods (and its hooks' handlers).
[[module]]
id = "glue-items"
file = "crates/horizon-client/src/game.rs"
name = "ess_glue_items"
source = "ess_glue_items.rs"

# Network: the item components Horizon keeps but doesn't send (lore, head profile, unbreakable, model data).
[[module]]
id = "items-net"
file = "crates/horizon-client/src/lan/hub.rs"
name = "ess_items_net"
source = "ess_items_net.rs"

# This area's injections ([[injection]] entries with helpers in this folder).
[[injection]]
id = "net-stack"
kind = "HEAD"
cancellable = true
target = "horizon_client::lan::hub::Hub::stack"
helper = "hook_net.rs"
bindings = [
  { name = "hub", ty = "&mut crate::lan::hub::Hub", value = "&mut *self" },
  { name = "s", ty = "&Option<crate::items::ItemStack>", value = "s" },
]

# lan_guest_packet holds macros (no hook there): each packet's own first call instead.
# Container clicks: lan_merchant_click is the first guard of every ContainerClick.
[[injection]]
id = "click"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::lan_trading::Game<'_>::lan_merchant_click"
helper = "hook_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "host", ty = "&mut crate::game::lan::LanHost", value = "&mut *host" },
  { name = "conn", ty = "u32", value = "conn" },
  { name = "p", ty = "&horizon_protocol::packets::play::ContainerClick", value = "p" },
]

# Powertools on attacking a player ({player}).
[[injection]]
id = "attack"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::lan_actions::Game<'_>::guest_attack"
helper = "hook_attack.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "host", ty = "&mut crate::game::lan::LanHost", value = "&mut *host" },
  { name = "conn", ty = "u32", value = "conn" },
  { name = "id", ty = "i32", value = "id" },
]

# Powertools on a left click (the Punch packet resets the guest's attack strength).
[[injection]]
id = "punch"
kind = "HEAD"
target = "horizon_client::game::hand::Game<'_>::reset_attack_strength"
helper = "hook_punch.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# Unlimited items: the held stack before a use on a block (UseItemOn checks spawn protection first).
[[injection]]
id = "use"
kind = "HEAD"
target = "horizon_client::game::lan_actions::Game<'_>::under_spawn_protection"
helper = "hook_use.rs"
bindings = [
  { name = "host", ty = "&crate::game::lan::LanHost", value = "host" },
  { name = "gi", ty = "usize", value = "gi" },
]

# Plugin containers live under stand-in chest keys at VEHICLE_KEY_Y: they stay valid.
[[injection]]
id = "vehicle-valid"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::lan_actions::Game<'_>::chest_vehicle_still_valid"
helper = "hook_vehicle.rs"
bindings = [{ name = "id", ty = "i32", value = "id" }]

# /workbench: a crafting table at VEHICLE_KEY_Y is valid.
[[injection]]
id = "table-valid"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::lan_crafting::Game<'_>::lan_table_valid"
helper = "hook_table.rs"
bindings = [{ name = "pos", ty = "[i32; 3]", value = "pos" }]

# /anvil, /loom...: hidden from the stations' block checks, back right after.
[[injection]]
id = "stations-hide"
kind = "HEAD"
target = "horizon_client::game::lan_stations::Game<'_>::lan_stations_tick"
helper = "hook_stations.rs"
bindings = [{ name = "host", ty = "&mut crate::game::lan::LanHost", value = "&mut *host" }]

[[injection]]
id = "stations-restore"
kind = "HEAD"
target = "horizon_client::game::lan_crafting::Game<'_>::lan_tables_tick"
helper = "hook_tables.rs"
bindings = [{ name = "host", ty = "&mut crate::game::lan::LanHost", value = "&mut *host" }]
