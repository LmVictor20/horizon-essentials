[mod]
id = "horizon-essentials-world"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "9669600c389ad6d205db4ec0bb061935f2a38d0c"

# Pure logic (also compiled by crates/ess-standalone for fast tests).
[[module]]
id = "world"
file = "crates/horizon-client/src/game.rs"
name = "ess_world"
source = "ess_world.rs"

# Game-only glue: this area's Host methods (and its hooks' handlers).
[[module]]
id = "glue-world"
file = "crates/horizon-client/src/game.rs"
name = "ess_glue_world"
source = "ess_glue_world.rs"


[[module]]
id = "discord"
file = "crates/horizon-client/src/game.rs"
name = "ess_discord"
source = "ess_discord.rs"

[[module]]
id = "geoip"
file = "crates/horizon-client/src/game.rs"
name = "ess_geoip"
source = "ess_geoip.rs"

[[module]]
id = "xmpp"
file = "crates/horizon-client/src/game.rs"
name = "ess_xmpp"
source = "ess_xmpp.rs"

[[module]]
id = "protect"
file = "crates/horizon-client/src/game.rs"
name = "ess_protect"
source = "ess_protect.rs"

# This area's injections go below ([[injection]] entries with helpers in this folder).

# The area's per-tick glue, after the core's tick hook.
[[injection]]
id = "world-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "hook_world_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# keepinv / keepxp before a guest's drops: guest_die (which has macros) first calls guest_forget_digging for a
# dying guest, before anything drops.
[[injection]]
id = "death"
kind = "HEAD"
target = "horizon_client::game::lan_actions::Game<'_>::guest_forget_digging"
helper = "hook_world_death.rs"
bindings = [
  { name = "host", ty = "&mut LanHost", value = "&mut *host" },
  { name = "conn", ty = "u32", value = "conn" },
]

# Survival flight: the abilities a fly-enabled player is told, and their own flight toggles.
[[injection]]
id = "fly-flags"
kind = "RETURN"
target = "horizon_client::lan::guest::Guest::ability_flags"
helper = "hook_fly_flags.rs"
bindings = [
  { name = "guest", ty = "&Guest", value = "&self" },
  { name = "value", ty = "i8", value = "$value" },
]

[[injection]]
id = "fly-inbox"
kind = "HEAD"
target = "horizon_client::lan::hub::Hub::tick_level"
helper = "hook_fly_inbox.rs"
bindings = [
  { name = "hub", ty = "&mut Hub", value = "&mut *self" },
]

# God mode and Protect's damage rules: every hurt of a player.
[[injection]]
id = "god"
kind = "HEAD"
cancellable = true
target = "horizon_client::health::PlayerMotion::hurt_caused_by"
helper = "hook_god.rs"
bindings = [
  { name = "motion", ty = "&mut PlayerMotion", value = "&mut *self" },
  { name = "resources", ty = "&HealthResources", value = "resources" },
  { name = "source", ty = "&DamageTypeId", value = "&source" },
]
